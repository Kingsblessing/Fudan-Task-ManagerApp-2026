server:
  port: 8080 # 应用端口

# 存储类型切换：改为'db'则切换为MySQL存储（无需修改Java代码）
storage:
  type: db

# AOP切面模式：debug开启切面日志，normal关闭
aop:
  mode: normal

# JWT 配置
jwt:
  secret: "TaskManagerSecretKey2026ForJWTTokenSigningMustBe256Bits"
  access-expiration: 900000     # 15分钟（毫秒）
  refresh-expiration: 604800000 # 7天（毫秒）

spring:
  datasource: # 数据库连接配置
    url: jdbc:mysql://localhost:3306/task_db?useSSL=false&serverTimezone=UTC
    username: root
    password: 25844796
    driver-class-name: com.mysql.cj.jdbc.Driver